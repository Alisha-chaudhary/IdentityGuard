name: IdentityGuard CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q
        env:
          IDENTITYGUARD_JWT_SECRET: "identityguard-ci-only-secret-not-for-production"

  fresh-clone-smoke:
    runs-on: ubuntu-latest
    env:
      IDENTITYGUARD_DATABASE_URL: sqlite:///./ci-smoke.db
      IDENTITYGUARD_JWT_SECRET: "identityguard-ci-only-secret-not-for-production"
      IDENTITYGUARD_SEED_PASSWORD: "Ci-Smoke-Passw0rd-123"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Seed a brand-new database
        run: python -m app.db.seed

      - name: Boot the app and log in
        run: python -m scripts.smoke_login

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t identityguard:ci .

      - name: Start container and check health
        run: |
          docker run -d --name ig -p 8000:8000 \
            -e IDENTITYGUARD_JWT_SECRET=ci-only-secret-not-for-production-use \
            -e IDENTITYGUARD_SEED_PASSWORD=Ci-Docker-Passw0rd-123 \
            -e IDENTITYGUARD_AUTO_SEED=true \
            -e IDENTITYGUARD_DATABASE_URL=sqlite:////data/identityguard.db \
            identityguard:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs ig
          exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

