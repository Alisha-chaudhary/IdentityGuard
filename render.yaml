services:
  - type: web
    name: identityguard
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh start_render.sh"
    envVars:
      - key: IDENTITYGUARD_JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
