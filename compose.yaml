services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IDENTITYGUARD_DATABASE_URL: sqlite:////data/identityguard.db
      IDENTITYGUARD_JWT_SECRET: ${IDENTITYGUARD_JWT_SECRET:?Set IDENTITYGUARD_JWT_SECRET in your environment}
    volumes:
      - identityguard_data:/data
    restart: unless-stopped

volumes:
  identityguard_data:
